<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               viewport-fit=cover">

<title>RP gezichtsveld</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
    font-family: Arial, sans-serif;
}

/* =========================
   CAMERA
   ========================= */

#camera {
    position: fixed;
    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    background: black;

    z-index: 1;
}

/* =========================
   ZWART MASKER
   ========================= */

#mask {

    position: fixed;
    inset: 0;

    z-index: 2;

    pointer-events: none;

    /*
       Het centrale gat wordt
       transparant gemaakt.
    */

    background:
        radial-gradient(
            circle at center,
            transparent 0,
            transparent var(--radius),
            black calc(var(--radius) + 2px),
            black 100%
        );
}

/* =========================
   BEDIENING
   ========================= */

#controls {

    position: fixed;

    left: 0;
    right: 0;
    bottom: 0;

    z-index: 10;

    background: rgba(20,20,20,0.96);

    color: white;

    padding: 16px;

    padding-bottom:
        calc(16px + env(safe-area-inset-bottom));

    text-align: center;
}

/* Knoppen */

.buttons {

    display: flex;

    justify-content: center;

    align-items: center;

    gap: 12px;

    flex-wrap: wrap;
}

button {

    appearance: none;
    -webkit-appearance: none;

    border: none;

    background: white;

    color: black;

    font-size: 18px;

    font-weight: bold;

    padding: 15px 22px;

    border-radius: 18px;

    cursor: pointer;

    touch-action: manipulation;
}

button:active {

    transform: scale(0.97);
}

/* =========================
   SCHUIFREGELAAR
   ========================= */

.slider-container {

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 12px;

    margin-top: 16px;

    font-size: 20px;

    font-weight: bold;
}

#fov {

    width: 45vw;

    max-width: 400px;

    min-width: 140px;

    height: 30px;

    touch-action: pan-x;
}

#percentage {

    width: 60px;

    text-align: right;
}

/* =========================
   TEKST
   ========================= */

#status {

    margin-top: 12px;

    font-size: 15px;

    color: #ddd;

    line-height: 1.4;
}

#error {

    display: none;

    margin-top: 8px;

    color: #ff8080;

    font-size: 15px;

    line-height: 1.4;
}

/* =========================
   LIGGEND
   ========================= */

@media (orientation: landscape) {

    #controls {

        padding: 8px 15px;

        padding-bottom:
            calc(8px + env(safe-area-inset-bottom));
    }

    button {

        font-size: 16px;

        padding: 10px 18px;
    }

    .slider-container {

        margin-top: 7px;

        font-size: 17px;
    }

    #status {

        margin-top: 5px;

        font-size: 13px;
    }
}

</style>
</head>


<body>


<!-- =========================
     CAMERA
     ========================= -->

<video
    id="camera"
    autoplay
    playsinline
    muted>
</video>


<!-- =========================
     ZWART MASKER
     ========================= -->

<div id="mask"></div>


<!-- =========================
     BEDIENING
     ========================= -->

<div id="controls">

    <div class="buttons">

        <button id="start">
            Start camera
        </button>

        <button id="flip">
            Camera omkeren
        </button>

        <button id="fullscreen">
            Volledig scherm
        </button>

    </div>


    <div class="slider-container">

        <span>
            Gezichtsveld
        </span>

        <input
            id="fov"
            type="range"
            min="5"
            max="100"
            value="20"
            step="1">

        <span id="percentage">
            20%
        </span>

    </div>


    <div id="status">

        Tik op <b>Start camera</b>
        om de camera te activeren.

    </div>


    <div id="error"></div>

</div>


<script>

/* =========================
   VARIABELEN
   ========================= */

const camera =
    document.getElementById("camera");

const mask =
    document.getElementById("mask");

const startButton =
    document.getElementById("start");

const flipButton =
    document.getElementById("flip");

const fullscreenButton =
    document.getElementById("fullscreen");

const slider =
    document.getElementById("fov");

const percentage =
    document.getElementById("percentage");

const status =
    document.getElementById("status");

const error =
    document.getElementById("error");


let stream = null;

let facingMode = "environment";


/* =========================
   GEZICHTSVELD
   ========================= */

function updateFOV() {

    const value =
        Number(slider.value);

    percentage.textContent =
        value + "%";


    /*
       Het centrale zichtbare gebied
       wordt gebaseerd op de kleinste
       schermmaat.

       20% = klein centraal gebied.
       100% = volledig beeld.
    */

    if (value >= 100) {

        mask.style.background =
            "transparent";

        return;
    }


    const radius =
        (value / 2) + "vmin";


    mask.style.setProperty(
        "--radius",
        radius
    );


    mask.style.background =
        `
        radial-gradient(
            circle at center,
            transparent 0,
            transparent var(--radius),
            black calc(var(--radius) + 2px),
            black 100%
        )
        `;
}


/* =========================
   CAMERA STARTEN
   ========================= */

async function startCamera() {

    error.style.display = "none";


    /*
       Als de camera al draait,
       niets opnieuw starten.
    */

    if (stream) {

        status.textContent =
            "Camera is al actief.";

        return;
    }


    try {

        status.textContent =
            "Camera wordt gestart...";


        /*
           Camera aanvragen.
        */

        stream =
            await navigator.mediaDevices
                .getUserMedia({

                    video: {

                        facingMode: {
                            ideal: facingMode
                        },

                        width: {
                            ideal: 1920
                        },

                        height: {
                            ideal: 1080
                        }

                    },

                    audio: false

                });


        /*
           Stream aan de video koppelen.
        */

        camera.srcObject =
            stream;


        /*
           Op iPhone Safari wachten
           totdat de video klaar is.
        */

        camera.onloadedmetadata =
            async function() {

                try {

                    await camera.play();

                    startButton.textContent =
                        "Camera actief";

                    status.textContent =
                        "Camera actief. Gebruik de schuifregelaar om het gezichtsveld aan te passen.";

                }

                catch (e) {

                    /*
                       Een AbortError van Safari
                       betekent niet noodzakelijk
                       dat de camera niet werkt.
                    */

                    if (
                        e.name !== "AbortError"
                    ) {

                        showError(
                            "De camera kon niet worden afgespeeld: " +
                            e.message
                        );

                    }

                }

            };

    }

    catch (e) {

        console.log(e);


        stream = null;


        if (
            e.name === "NotAllowedError"
        ) {

            showError(
                "Cameratoegang is geweigerd. Geef deze website toegang tot de camera."
            );

        }

        else if (
            e.name === "NotFoundError"
        ) {

            showError(
                "Er is geen camera gevonden."
            );

        }

        else {

            showError(
                "De camera kon niet worden gestart: " +
                e.message
            );

        }


        status.textContent =
            "Probeer opnieuw op Start camera te drukken.";
    }
}


/* =========================
   CAMERA OMDRAAIEN
   ========================= */

async function flipCamera() {

    if (!stream) {

        facingMode =
            facingMode === "environment"
                ? "user"
                : "environment";

        status.textContent =
            "De volgende keer wordt de andere camera gebruikt.";

        return;
    }


    /*
       Eerst huidige camera stoppen.
    */

    stream
        .getTracks()
        .forEach(
            track => track.stop()
        );


    stream = null;


    camera.srcObject = null;


    /*
       Andere camera kiezen.
    */

    facingMode =
        facingMode === "environment"
            ? "user"
            : "environment";


    /*
       Even wachten voordat
       iOS opnieuw een camera opent.
    */

    await new Promise(
        resolve =>
            setTimeout(resolve, 300)
    );


    await startCamera();
}


/* =========================
   VOLLEDIG SCHERM
   ========================= */

async function goFullscreen() {

    try {

        if (
            document.documentElement
                .requestFullscreen
        ) {

            await document.documentElement
                .requestFullscreen();

        }

        else if (
            document.documentElement
                .webkitRequestFullscreen
        ) {

            document.documentElement
                .webkitRequestFullscreen();

        }

    }

    catch (e) {

        console.log(e);
    }
}


/* =========================
   FOUT
   ========================= */

function showError(text) {

    error.textContent =
        text;

    error.style.display =
        "block";
}


/* =========================
   KNOPPEN
   ========================= */

startButton.addEventListener(
    "click",
    startCamera
);


flipButton.addEventListener(
    "click",
    flipCamera
);


fullscreenButton.addEventListener(
    "click",
    goFullscreen
);


/* =========================
   SCHUIFREGELAAR
   ========================= */

slider.addEventListener(
    "input",
    updateFOV
);


/*
   Ook change voor iOS.
*/

slider.addEventListener(
    "change",
    updateFOV
);


/* =========================
   STARTWAARDE
   ========================= */

updateFOV();

</script>

</body>
</html>
