<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RP gezichtsveld</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  font-family: Arial, sans-serif;
}

body {
  background: #000;
}

/* Camerabeeld */
#camera {
  position: fixed;
  width: 100vw;
  height: 100vh;
  object-fit: cover;
  left: 0;
  top: 0;
  display: none;
}

/* Het zichtbare centrale gezichtsveld */
#vision {
  position: fixed;
  left: 50%;
  top: 45%;
  transform: translate(-50%, -50%);
  width: 20vw;
  height: 20vw;
  max-width: 90vw;
  max-height: 70vh;
  border-radius: 50%;
  overflow: hidden;
  background: #000;
  display: none;
}

/* Camera binnen het centrale venster */
#vision video {
  position: absolute;
  width: 100vw;
  height: 100vh;
  max-width: none;
  max-height: none;
  object-fit: cover;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
}

/* Bedieningspaneel */
#controls {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(20,20,20,0.96);
  padding: 16px;
  padding-bottom: calc(16px + env(safe-area-inset-bottom));
  color: white;
  z-index: 10;
}

.buttons {
  display: flex;
  justify-content: center;
  gap: 12px;
  flex-wrap: wrap;
}

button {
  border: none;
  background: white;
  color: black;
  font-size: 18px;
  font-weight: bold;
  padding: 16px 22px;
  border-radius: 18px;
  cursor: pointer;
}

button:active {
  transform: scale(0.97);
}

.slider {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 16px;
  font-size: 20px;
  font-weight: bold;
}

input[type="range"] {
  flex: 1;
  min-width: 100px;
}

#percentage {
  width: 55px;
  text-align: right;
}

#message {
  text-align: center;
  margin-top: 12px;
  font-size: 15px;
  color: #ddd;
  line-height: 1.4;
}

#error {
  text-align: center;
  color: #ff8080;
  margin-top: 8px;
  display: none;
}

/* Horizontale telefoon */
@media (orientation: landscape) {

  #vision {
    top: 43%;
    width: 20vh;
    height: 20vh;
  }

  #controls {
    padding: 10px 15px;
  }

  button {
    font-size: 16px;
    padding: 10px 18px;
  }

  .slider {
    margin-top: 8px;
    font-size: 17px;
  }

  #message {
    margin-top: 6px;
    font-size: 13px;
  }
}
</style>
</head>

<body>

<!-- Centrale camera -->
<div id="vision">
  <video id="camera" autoplay playsinline muted></video>
</div>

<!-- Bedieningen -->
<div id="controls">

  <div class="buttons">

    <button id="startButton">
      Start camera
    </button>

    <button id="flipButton">
      Camera omkeren
    </button>

    <button id="fullscreenButton">
      Volledig scherm
    </button>

  </div>

  <div class="slider">

    <span>Gezichtsveld</span>

    <input
      id="fov"
      type="range"
      min="5"
      max="100"
      value="20"
      step="1"
    >

    <span id="percentage">20%</span>

  </div>

  <div id="message">
    Tik op <b>Start camera</b> en geef toestemming voor de camera.
  </div>

  <div id="error"></div>

</div>

<script>

let stream = null;

/* Achtercamera standaard */
let cameraMode = "environment";

const camera = document.getElementById("camera");
const vision = document.getElementById("vision");

const startButton =
  document.getElementById("startButton");

const flipButton =
  document.getElementById("flipButton");

const fullscreenButton =
  document.getElementById("fullscreenButton");

const fov =
  document.getElementById("fov");

const percentage =
  document.getElementById("percentage");

const message =
  document.getElementById("message");

const error =
  document.getElementById("error");


/* Gezichtsveld aanpassen */
function updateFOV() {

  const value = Number(fov.value);

  percentage.textContent = value + "%";

  if (value >= 99) {

    vision.style.width = "100vw";
    vision.style.height = "100vh";
    vision.style.borderRadius = "0";

  } else {

    /*
      20% betekent een klein centraal
      gezichtsveld, vergelijkbaar met
      tunnelzicht bij RP.
    */

    const size = value + "vw";

    vision.style.width = size;
    vision.style.height = size;

    vision.style.borderRadius = "50%";
  }
}


/* Camera starten */
async function startCamera() {

  error.style.display = "none";

  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ) {

    showError(
      "Deze browser ondersteunt geen cameratoegang."
    );

    return;
  }

  try {

    /* Oude camera stoppen */
    if (stream) {

      stream.getTracks().forEach(
        track => track.stop()
      );
    }

    message.textContent =
      "Camera wordt gestart...";

    /*
      Camera aanvragen.
      Achtercamera bij voorkeur.
    */

    stream =
      await navigator.mediaDevices.getUserMedia({

        video: {

          facingMode: {
            ideal: cameraMode
          },

          width: {
            ideal: 1920
          },

          height: {
            ideal: 1080
          }

        },

        audio: false
      });


    camera.srcObject = stream;

    await camera.play();


    /* Centrale cirkel zichtbaar maken */
    vision.style.display = "block";


    startButton.textContent =
      "Camera actief";

    message.textContent =
      "Camera actief. Stel het gezichtsveld in met de schuifregelaar.";

  }

  catch (e) {

    console.log(e);

    if (
      e.name === "NotAllowedError" ||
      e.name === "PermissionDeniedError"
    ) {

      showError(
        "Cameratoegang is geweigerd. Geef deze website toestemming voor de camera."
      );

    } else if (
      e.name === "NotFoundError"
    ) {

      showError(
        "Er is geen camera gevonden."
      );

    } else {

      showError(
        "De camera kon niet worden gestart: " +
        e.message
      );
    }

    message.textContent =
      "Probeer opnieuw op Start camera te drukken.";
  }
}


/* Camera omkeren */
async function flipCamera() {

  if (!stream) {

    cameraMode =
      cameraMode === "environment"
        ? "user"
        : "environment";

    return;
  }

  cameraMode =
    cameraMode === "environment"
      ? "user"
      : "environment";

  await startCamera();
}


/* Volledig scherm */
async function fullscreen() {

  try {

    if (
      document.documentElement.requestFullscreen
    ) {

      await document.documentElement.requestFullscreen();

    } else if (
      document.documentElement.webkitRequestFullscreen
    ) {

      document.documentElement.webkitRequestFullscreen();
    }

  } catch (e) {

    console.log(e);
  }
}


/* Foutmelding */
function showError(text) {

  error.textContent = text;

  error.style.display = "block";
}


/* Bedieningen */
startButton.addEventListener(
  "click",
  startCamera
);

flipButton.addEventListener(
  "click",
  flipCamera
);

fullscreenButton.addEventListener(
  "click",
  fullscreen
);

fov.addEventListener(
  "input",
  updateFOV
);


/* Begininstelling */
updateFOV();

</script>

</body>
</html>
